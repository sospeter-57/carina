services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carina
      POSTGRES_PASSWORD: carina
      POSTGRES_DB: carina
    ports:
      - "5432:5432"
    volumes:
      - /home/skinyanju/jmb/jmb/data/postgres_data_carina:/postgres_data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - /home/skinyanju/jmb/jmb/data/redis_data_carina:/redis_data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: carina
      MINIO_ROOT_PASSWORD: carina123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /home/skinyanju/jmb/jmb/data/minio_data_carina:/minio_data

  app:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio


volumes:
  postgres_data:
  redis_data:
  minio_data: